name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Preparar sitio
        run: |
          mkdir _site
          cp -R index.html app.js style.css design-targets.json .nojekyll assets contenidos documentos descargas _site/
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
